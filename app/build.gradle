plugins {
    id 'com.android.application'
}

android {
    namespace 'com.waed.widget'
    compileSdk 35

    defaultConfig {
        applicationId 'com.waed.widget'
        minSdk 26
        targetSdk 35
        versionCode 8
        versionName '1.5.0'
    }

    def releaseKeystore = System.getenv('WAED_RELEASE_KEYSTORE')
    def releaseStorePassword = System.getenv('WAED_RELEASE_STORE_PASSWORD')
    def releaseKeyAlias = System.getenv('WAED_RELEASE_KEY_ALIAS')
    def releaseKeyPassword = System.getenv('WAED_RELEASE_KEY_PASSWORD')

    signingConfigs {
        if (releaseKeystore && releaseStorePassword && releaseKeyAlias && releaseKeyPassword) {
            release {
                storeFile file(releaseKeystore)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (signingConfigs.findByName('release') != null) {
                signingConfig signingConfigs.release
            }
        }
    }

    androidResources {
        additionalParameters += ['--stable-ids', file('stable-resource-ids.txt').absolutePath]
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
