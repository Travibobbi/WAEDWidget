name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: ./gradlew --no-daemon clean assembleDebug
      - name: Name versioned APK
        if: startsWith(github.ref, 'refs/tags/v')
        run: cp app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/WAEDWidget-${GITHUB_REF_NAME}-debug.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: WAEDWidget-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" "app/build/outputs/apk/debug/WAEDWidget-${GITHUB_REF_NAME}-debug.apk" --title "WA ED Widget ${GITHUB_REF_NAME}" --generate-notes
