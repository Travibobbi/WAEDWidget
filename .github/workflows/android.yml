name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RELEASE_BUILD: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
      WAED_UPGRADE_PROBE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check analysis and CSV parsing
        run: |
          node --test app/src/test-analysis/*.test.cjs
          mkdir -p app/build/csv-test
          javac -d app/build/csv-test app/src/main/java/com/waed/widget/WidgetCsv.java app/src/test-analysis/WidgetCsvTest.java
          java -cp app/build/csv-test com.waed.widget.WidgetCsvTest
      - name: Restore release signing key
        if: env.RELEASE_BUILD == 'true'
        env:
          WAED_KEYSTORE_BASE64: ${{ secrets.WAED_KEYSTORE_BASE64 }}
        run: |
          test -n "$WAED_KEYSTORE_BASE64" || { echo "WAED_KEYSTORE_BASE64 is not configured"; exit 1; }
          printf '%s' "$WAED_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/waed-release.jks"
      - name: Build APK
        env:
          WAED_RELEASE_KEYSTORE: ${{ env.RELEASE_BUILD == 'true' && format('{0}/waed-release.jks', runner.temp) || '' }}
          WAED_RELEASE_STORE_PASSWORD: ${{ secrets.WAED_RELEASE_STORE_PASSWORD }}
          WAED_RELEASE_KEY_ALIAS: ${{ secrets.WAED_RELEASE_KEY_ALIAS }}
          WAED_RELEASE_KEY_PASSWORD: ${{ secrets.WAED_RELEASE_KEY_PASSWORD }}
        run: |
          if [[ "$RELEASE_BUILD" == true ]]; then
            ./gradlew --no-daemon :app:assembleRelease :app:lintRelease :upgrade-probe:assembleRelease
          else
            ./gradlew --no-daemon :app:assembleDebug :app:lintDebug :upgrade-probe:assembleDebug
          fi
      - name: Verify production identity and unchanged history storage
        if: env.RELEASE_BUILD == 'true'
        run: bash scripts/verify-release.sh
      - name: Enable emulator acceleration
        if: env.RELEASE_BUILD == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test actual 1.5 to 2.0 in-place upgrade
        if: env.RELEASE_BUILD == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash scripts/verify-upgrade.sh
      - name: Name versioned APK
        if: startsWith(github.ref, 'refs/tags/v')
        run: cp app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/WAEDWidget-${GITHUB_REF_NAME}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: WAEDWidget
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" "app/build/outputs/apk/release/WAEDWidget-${GITHUB_REF_NAME}.apk" --title "WA ED Widget ${GITHUB_REF_NAME}" --notes-file RELEASE_NOTES.md
      - name: Remove ephemeral signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/waed-release.jks"
